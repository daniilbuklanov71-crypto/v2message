<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V2 — private messenger</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#000;--p1:#0c0c0e;--p2:#161618;--line:#232326;--text:#f2f2f4;--mut:#86868e;--acc:#2f9e72;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#000}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;position:relative;overflow:hidden}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--acc);color:#fff;cursor:pointer}
button.g{background:var(--p2);color:var(--text)}
input{font:inherit;font-size:16px;color:var(--text);background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-width:0;width:100%}
input:focus{outline:1px solid var(--acc)}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#2f9e72;flex:none;display:block}
.av.s{width:42px;height:42px}.av.l{width:96px;height:96px}
.ph{display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:#26262a}
.scr{position:absolute;inset:0;z-index:10;background:#000;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.scr form,.scr>div{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;align-items:center}
.scr h1{margin:4px 0 0;font-size:26px}
.scr p{margin:0 0 8px;color:var(--mut);text-align:center}
.err{color:#ff6b6b;min-height:20px;font-size:14px;text-align:center;overflow-wrap:anywhere}
#app{display:flex;height:100%}
#side{width:320px;flex:none;border-right:1px solid var(--line);background:var(--p1);display:flex;flex-direction:column;min-height:0}
#me{display:flex;gap:12px;align-items:center;padding:14px}
#me b{display:block}#me span{color:var(--mut);font-size:14px}
#add{margin:0 14px 10px;display:flex;gap:8px;align-items:center}
#plus{width:44px;height:44px;padding:0;font-size:26px;line-height:1;border-radius:50%}
#addbox{display:none;margin:0 14px 10px;gap:8px}#addbox.on{display:flex}
#addmsg{margin:0 14px 8px;color:var(--mut);font-size:13px}
#chats{flex:1;overflow-y:auto;border-top:1px solid var(--line)}
.ch{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.ch.on{background:var(--p2)}
.ch .t{flex:1;min-width:0}
.ch .t b,.ch .t span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .t span{color:var(--mut);font-size:14px}
.ch time{color:var(--mut);font-size:12px}
.empty{color:var(--mut);text-align:center;padding:28px 18px;font-size:14px}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
#top{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--p1);min-height:62px}
#back{display:none;padding:8px 12px}
#top b{display:block}#top span{color:var(--mut);font-size:13px}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:8px 12px;border-radius:18px;background:var(--p2);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.m.me{background:var(--acc);align-self:flex-end}
.m i{display:block;font-style:normal;font-size:11px;opacity:.6;text-align:right;margin-top:2px}
#ph{flex:1;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:var(--mut)}
#f{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--p1)}
#st{text-align:center;color:var(--mut);font-size:13px;padding:4px}
@media(max-width:700px){
 #side{width:100%;border-right:0}
 #main{position:absolute;inset:0;transform:translateX(100%);transition:transform .2s}
 body.open #main{transform:none}
 #back{display:block}
}
</style>
</head>
<body>

<div class="scr" id="setup" hidden>
 <div>
  <video class="av l" muted loop autoplay playsinline></video>
  <h1>Подключение к серверу</h1>
  <p>Вставьте данные вашего проекта Supabase (Project URL и Publishable key)</p>
  <input id="cu" placeholder="https://xxxx.supabase.co" autocapitalize="none" autocorrect="off">
  <input id="ck" placeholder="sb_publishable_..." autocapitalize="none" autocorrect="off">
  <div class="err" id="cerr"></div>
  <button id="cs" style="width:100%">Сохранить</button>
 </div>
</div>

<div class="scr" id="auth" hidden>
 <form id="af" autocomplete="off">
  <video class="av l" muted loop autoplay playsinline></video>
  <h1>V2</h1>
  <p>private messenger</p>
  <input id="an" placeholder="Никнейм (латиница, цифры, _)" maxlength="20" autocapitalize="none" autocorrect="off">
  <input id="ap" placeholder="Номер телефона" inputmode="tel" maxlength="20">
  <input id="am" placeholder="Имя" maxlength="30">
  <input id="aw" type="password" placeholder="Пароль (от 6 символов)" maxlength="64" autocomplete="off">
  <div class="err" id="aerr"></div>
  <button type="submit" id="sb" style="width:100%">Зарегистрироваться</button>
  <button type="button" class="g" id="sw" style="width:100%">Уже есть аккаунт? Войти</button>
  <button type="button" class="g" id="share" style="width:100%;font-size:13px">Ссылка для друзей</button>
  <input id="shl" readonly hidden style="font-size:12px">
 </form>
</div>

<div id="app" hidden>
 <aside id="side">
  <div id="me">
   <video class="av" muted loop autoplay playsinline></video>
   <div style="flex:1;min-width:0"><b id="mname"></b><span id="mnick"></span></div>
   <button class="g" id="lo" style="padding:8px 10px;font-size:13px">Выйти</button>
  </div>
  <div id="add"><button id="plus" title="Найти друга">+</button><span style="color:var(--mut);font-size:14px">Найти друга</span></div>
  <div id="addbox"><input id="fi" placeholder="@имяпользователя" autocapitalize="none" autocorrect="off"><button id="fg">Найти</button></div>
  <div id="addmsg"></div>
  <div id="chats"></div>
 </aside>
 <section id="main">
  <div id="ph"><video class="av l" muted loop autoplay playsinline></video><div>Выберите чат слева</div></div>
  <div id="cv" style="display:none;flex-direction:column;flex:1;min-height:0">
   <div id="top"><button class="g" id="back">‹</button><div class="av s ph" id="pa"></div><div><b id="pn"></b><span id="pk"></span></div></div>
   <div id="msgs"></div>
   <div id="st"></div>
   <form id="f"><input id="tx" maxlength="1000" placeholder="Сообщение" autocomplete="off" enterkeyhint="send"><button type="submit">➤</button></form>
  </div>
 </section>
</div>

  var r;
  if(mode==='reg'){
   r=await sb.auth.signUp({email:dom(nick),password:pw,options:{data:{nick:nick,name:nm,phone:ph}}});
   if(r.error)return say('aerr',/registered|exists/i.test(r.error.message)?'Этот никнейм уже занят':r.error.message);
   if(!r.data.session)return say('aerr','В Supabase отключите Confirm email (Authentication → Sign In / Providers → Email)');
  }else{
   r=await sb.auth.signInWithPassword({email:dom(nick),password:pw});
   if(r.error)return say('aerr',/invalid/i.test(r.error.message)?'Неверный никнейм или пароль':r.error.message);
  }
  $('aw').value='';
  await after(r.data.user);
 }catch(x){say('aerr','Нет связи с сервером')}
});

async function after(user){
 me=user;
 var r=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
 prof=r.data;
 if(!prof){
  var md=user.user_metadata||{};
  var ins=await sb.from('profiles').insert({id:user.id,nick:md.nick,name:md.name}).select().single();
  if(ins.error){await sb.auth.signOut();show('auth');return say('aerr','Не удалось создать профиль: '+ins.error.message)}
  prof=ins.data;
  if(md.phone)await sb.from('private_info').upsert({id:user.id,phone:md.phone});
 }
 say('mname',prof.name);say('mnick','@'+prof.nick);
 show('app');
 await loadChats();
 if(chCh)sb.removeChannel(chCh);
 chCh=sb.channel('chats-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'chats'},function(){loadChats()}).subscribe();
}

function peerId(c){return c.user_a===me.id?c.user_b:c.user_a}
async function loadChats(){
 var r=await sb.from('chats').select('*').order('last_at',{ascending:false});
 chats=r.data||[];
 var ids=chats.map(peerId).filter(function(id,i,a){return !peers[id]&&a.indexOf(id)===i});
 if(ids.length){var p=await sb.from('profiles').select('id,nick,name').in('id',ids);(p.data||[]).forEach(function(x){peers[x.id]=x})}
 drawChats();
}
function drawChats(){
 var box=$('chats');box.textContent='';
 if(!chats.length){var e=document.createElement('div');e.className='empty';e.textContent='Чатов пока нет. Нажмите + и найдите друга по @нику.';box.appendChild(e);return}
 chats.forEach(function(c){
  var p=peers[peerId(c)]||{name:'?',nick:'?'},r=document.createElement('div');r.className='ch'+(cur&&cur.id===c.id?' on':'');
  var a=document.createElement('div');a.className='av ph';a.textContent=ini(p.name);
  var t=document.createElement('div');t.className='t';
  var b=document.createElement('b');b.textContent=p.name;
  var s=document.createElement('span');s.textContent=c.last_text||'@'+p.nick;
  t.appendChild(b);t.appendChild(s);
  var h=document.createElement('time');h.textContent=c.last_text?tm(c.last_at):'';
  r.appendChild(a);r.appendChild(t);r.appendChild(h);
  r.onclick=function(){openChat(c)};
  box.appendChild(r);
 });
}

function addMsg(m){
 if(seen[m.id])return;seen[m.id]=1;
 var l=$('msgs'),stick=l.scrollHeight-l.scrollTop-l.clientHeight<90;
 var x=document.createElement('div');x.className='m'+(m.sender===me.id?' me':'');
 x.appendChild(document.createTextNode(String(m.body)));
 var i=document.createElement('i');i.textContent=tm(m.created_at);x.appendChild(i);l.appendChild(x);
 if(stick||m.sender===me.id)l.scrollTop=l.scrollHeight;
 say('st','');
}
async function openChat(c){
 cur=c;seen={};var p=peers[peerId(c)]||{name:'?',nick:'?'};
 $('ph').style.display='none';$('cv').style.display='flex';document.body.classList.add('open');
 say('pa',ini(p.name));say('pn',p.name);say('pk','@'+p.nick);
 $('msgs').textContent='';say('st','Загрузка…');drawChats();
 if(msgCh){sb.removeChannel(msgCh);msgCh=null}
 var id=c.id;
 msgCh=sb.channel('msgs-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'chat_id=eq.'+id},function(pl){if(cur&&cur.id===id)addMsg(pl.new)}).subscribe();
 var r=await sb.from('messages').select('*').eq('chat_id',id).order('created_at',{ascending:true}).limit(300);
 if(!cur||cur.id!==id)return;
 if(r.error)return say('st','Ошибка загрузки');
 say('st',r.data.length?'':'Напишите первое сообщение');
 r.data.forEach(addMsg);
 $('msgs').scrollTop=$('msgs').scrollHeight;
}
$('back').onclick=function(){document.body.classList.remove('open')};

$('f').addEventListener('submit',async function(e){
 e.preventDefault();var v=$('tx').value.trim();if(!v||!cur)return;$('tx').value='';
 var r=await sb.from('messages').insert({chat_id:cur.id,sender:me.id,body:v.slice(0,1000)}).select().single();
 if(r.error)say('st','Не отправлено');else addMsg(r.data);
});

$('plus').onclick=function(){$('addbox').classList.toggle('on');say('addmsg','');if($('addbox').classList.contains('on'))$('fi').focus()};
$('fi').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();$('fg').click()}});
$('fg').onclick=async function(){
 var n=$('fi').value.trim().replace(/^@/,'').toLowerCase();if(!n)return;
 if(n===prof.nick)return say('addmsg','Это вы :)');
 say('addmsg','Ищем…');
 var q=await sb.from('profiles').select('id,nick,name').eq('nick',n).maybeSingle();
 if(q.error)return say('addmsg','Ошибка поиска');
 if(!q.data)return say('addmsg','Пользователь @'+n+' не найден');
 peers[q.data.id]=q.data;
 var a=me.id<q.data.id?me.id:q.data.id,b=me.id<q.data.id?q.data.id:me.id;
 var ex=await sb.from('chats').select('*').eq('user_a',a).eq('user_b',b).maybeSingle(),c=ex.data;
 if(!c){var ins=await sb.from('chats').insert({user_a:a,user_b:b}).select().single();if(ins.error)return say('addmsg','Не удалось создать чат');c=ins.data}
 $('fi').value='';$('addbox').classList.remove('on');say('addmsg','');
 await loadChats();openChat(c);
};

$('lo').onclick=async function(){
 try{if(chCh)sb.removeChannel(chCh);if(msgCh)sb.removeChannel(msgCh)}catch(e){}
 chCh=msgCh=null;cur=null;chats=[];peers={};me=prof=null;
 await sb.auth.signOut();
 $('chats').textContent='';$('cv').style.display='none';$('ph').style.display='flex';document.body.classList.remove('open');
 $('an').value=$('aw').value='';setMode('login');show('auth');
};

async function boot(){
 var c=cfg();
 if(!c){show('setup');return}
 if(!window.supabase){show('setup');return say('cerr','Не загрузилась библиотека Supabase. Проверьте интернет.')}
 sb=supabase.createClient(c.u,c.k);
 var s=await sb.auth.getSession();
 if(s.data&&s.data.session){try{await after(s.data.session.user)}catch(e){show('auth')}}
 else{setMode('login');show('auth')}
}
boot();
})();
</script>
</body>
</html>
